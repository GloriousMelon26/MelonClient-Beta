<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MelonClient</title>
    <!-- Imports Retro Minecraft Font Face -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <!-- UI Layout Links -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. BRAND LOGO LOADING SPLASH -->
    <div id="loading-screen">
        <img src="logo.png" alt="MelonClient Logo" class="brand-logo">
    </div>

    <!-- 2. MINECRAFT STYLED SYSTEM BOOT MANAGER -->
    <div id="boot-screen">
        <div class="boot-panel">
            <h2>MelonClient Boot Config</h2>
            
            <div class="input-group">
                <label>Eaglercraft Runtime Client URL</label>
                <input type="text" id="client-url" placeholder="Paste server link here..." value="https://eaglercraft.com">
            </div>
            
            <div class="input-group">
                <label>Or Upload Standalone Offline Client</label>
                <label class="file-custom">
                    <input type="file" id="client-file" accept=".html" style="display:none;">
                    <span id="file-status">Click to browse local .html binary</span>
                </label>
            </div>

            <button class="launch-btn" onclick="launchClientEngine()">LAUNCH METRICS</button>
        </div>
    </div>

    <!-- 3. ACTIVE CLIENT VIEW CONTAINMENT SPACE -->
    <div id="game-container"></div>

    <!-- 4. MELONCHAT STOAT EMBED OVERLAY FRAME -->
    <div id="melon-chat">
        <div class="chat-header">
            <span class="chat-title">[MelonChat Dashboard]</span>
            <button class="close-btn" onclick="toggleChatInterface()">X</button>
        </div>
        <div class="chat-body">
            <!-- Embedding official web runtime directly to ensure native video calls, friend management, and room generation remain unblocked -->
            <iframe id="chat-frame" src="https://stoat.chat" allow="clipboard-write; microphone; camera; display-capture"></iframe>
        </div>
    </div>

    <!-- 5. RETRO NOTIFICATION ALERT BOUNDARY PANE -->
    <div id="melon-notification-container"></div>

    <!-- 6. HUD BOTTOM RIGHT INTERACTION TRIGGER -->
    <button id="melon-chat-hud-trigger" onclick="toggleChatInterface()">MelonChat</button>

    <!-- JavaScript Hook Script Engine -->
    <script src="app.js"></script>
</body>
</html>
